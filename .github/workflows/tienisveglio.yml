# GitHub spegne i lavori programmati dei repository senza attivita' per 60 giorni: una volta al mese si fa un commit vuoto per tenerlo acceso.
name: tienisveglio
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sveglia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "barbel-radar"
          git config user.email "hello@barbel.app"
          git commit --allow-empty -m "radar: ancora attivo"
          git push
